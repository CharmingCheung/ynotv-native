name: Build native runtime

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Read release version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: brew install mpv openssl@3 meson ninja pkg-config
      - name: Build relocatable runtime
        env:
          PKG_CONFIG_PATH: /opt/homebrew/opt/openssl@3/lib/pkgconfig
        run: ./scripts/build-macos.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ynotv-native-macos-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  windows-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - name: Read release version
        id: version
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            p7zip
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-libplacebo
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-tools
            mingw-w64-ucrt-x86_64-llvm-tools
      - name: Verify FFmpeg development files
        shell: msys2 {0}
        run: |
          if ! pkg-config --exists libavcodec libavformat libavutil; then
            pacman --noconfirm -S --overwrite '*' mingw-w64-ucrt-x86_64-ffmpeg
          fi
          pkg-config --print-errors --exists libavcodec libavformat libavutil
      - name: Build relocatable runtime
        shell: msys2 {0}
        run: ./scripts/build-windows.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ynotv-native-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/master'
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! gh release view "$version" >/dev/null 2>&1; then
            gh release create "$version" --target "$GITHUB_SHA" --generate-notes
          fi
          existing=$(gh release view "$version" --json assets --jq '.assets[].name')
          for file in dist/*; do
            name=$(basename "$file")
            if grep -Fxq "$name" <<<"$existing"; then
              echo "$name already exists; keeping immutable asset unchanged."
            else
              gh release upload "$version" "$file"
            fi
          done

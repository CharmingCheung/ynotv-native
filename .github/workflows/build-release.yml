name: Build native runtime

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: brew install mpv meson ninja pkg-config
      - name: Build relocatable runtime
        run: ./scripts/build-macos.sh "${GITHUB_REF_NAME:-dev}"
      - uses: actions/upload-artifact@v4
        with:
          name: ynotv-native-macos-arm64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.sha256 \
            --verify-tag --generate-notes
